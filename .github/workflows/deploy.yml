name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: homehn-backend
  APP_DIR: /home/ubuntu/homehn-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Prepare deployable jar
        run: cp target/${{ env.APP_NAME }}-*.jar ${{ env.APP_NAME }}.jar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "${{ env.APP_NAME }}.jar"
          target: "${{ env.APP_DIR }}"

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            APP_NAME="${{ env.APP_NAME }}"
            APP_DIR="${{ env.APP_DIR }}"
            mkdir -p $APP_DIR/logs $APP_DIR/uploads

            cat > $APP_DIR/run.sh << 'EOF'
            #!/bin/bash
            set -e

            APP_NAME=homehn-backend
            APP_DIR=/home/ubuntu/homehn-backend
            JAR_FILE=$APP_DIR/$APP_NAME.jar
            LOG_FILE=$APP_DIR/logs/app.log

            mkdir -p $APP_DIR/logs
            mkdir -p $APP_DIR/uploads

            if [ -f "$APP_DIR/.env" ]; then
              echo "Loading env from $APP_DIR/.env..."
              set -a
              . "$APP_DIR/.env"
              set +a
            fi

            echo "Stopping old app..."
            pkill -f "$JAR_FILE" || true
            sleep 2

            echo "Starting new app..."
            nohup java \
              -Dspring.profiles.active=prod \
              -jar "$JAR_FILE" \
              > $LOG_FILE 2>&1 &

            echo "Done! PID=$!"
            EOF

            chmod +x $APP_DIR/run.sh
            $APP_DIR/run.sh
